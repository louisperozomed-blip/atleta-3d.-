<title>Maniquí masculino facetado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Maqueta: escenario 3D a pantalla completa; ficha técnica arriba, cámaras abajo, capas a la derecha */
:root {
  --bg: #e9e7e3;          /* papel de taller, gris cálido */
  --stage: #d7d4ce;       /* fondo del escenario 3D */
  --panel: rgba(250, 249, 247, 0.86);
  --fg: #1d1e21;
  --muted: #62646b;
  --line: #bdb9b1;
  --accent: #2f5f9e;      /* azul de plano: regla y selección */
  --accent-fg: #ffffff;
  --edge: #26272b;        /* aristas del modelo */
  --ruler: #2f5f9e;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141518; --stage: #1b1c20; --panel: rgba(30, 31, 36, 0.86); --fg: #ecebe8; --muted: #9a9ca3;
    --line: #3a3c43; --accent: #8fb3ea; --accent-fg: #0f1a2c; --edge: #0c0c0e; --ruler: #8fb3ea; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141518; --stage: #1b1c20; --panel: rgba(30, 31, 36, 0.86); --fg: #ecebe8; --muted: #9a9ca3;
  --line: #3a3c43; --accent: #8fb3ea; --accent-fg: #0f1a2c; --edge: #0c0c0e; --ruler: #8fb3ea; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
.app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; background: var(--stage); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; inset: 0; pointer-events: none; display: grid;
  grid-template-rows: auto 1fr auto; padding-block: 16px; padding-inline: 16px; gap: 12px; }
.hud > * { pointer-events: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px); }
header.card { justify-self: start; max-width: min(460px, 100%); padding: 12px 14px; display: grid; gap: 8px; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; line-height: 1.1; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); line-height: 1.45; }
dl.specs { margin: 0; display: grid; grid-template-columns: repeat(4, auto); gap: 4px 16px; justify-content: start; }
.specs div { display: grid; gap: 1px; min-width: 0; }
.specs dt { font-family: var(--f-display); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.specs dd { margin: 0; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.bottom { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; }
.seg button, .toggles label { font: 600 13px/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 9px 12px; border-radius: 4px; cursor: pointer; min-width: 44px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:focus-visible, .toggles input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 10px 12px; }
.toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--fg); }
.toggles input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.hint { font-size: 12px; color: var(--muted); padding: 0 2px; }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  h1 { font-size: 19px; }
  dl.specs { grid-template-columns: repeat(2, auto); }
  .sub { display: none; }
  .bottom { flex-direction: column; align-items: stretch; }
  .seg { justify-content: space-between; }
  .seg button { flex: 1; padding-inline: 6px; }
}
</style>

<div class="app">
  <div id="stage" aria-label="Vista 3D del maniquí; arrastra para girar, rueda o pellizco para acercar"></div>
  <div class="hud">
    <header class="card">
      <h1>Maniquí masculino facetado</h1>
      <p class="sub">Base mesh low/mid poly de 1.80 m y 8 cabezas, modelado desde la hoja de referencia. Una malla cerrada, simétrica, de quads, con sombreado plano.</p>
      <dl class="specs">
        <div><dt>Caras</dt><dd id="s-faces">1 566</dd></div>
        <div><dt>Quads</dt><dd id="s-quads">100 %</dd></div>
        <div><dt>Altura</dt><dd id="s-h">1.797 m</dd></div>
        <div><dt>Cabeza</dt><dd id="s-head">0.225 m</dd></div>
      </dl>
    </header>
    <div></div>
    <div class="bottom">
      <div class="card seg" role="group" aria-label="Cámara">
        <button type="button" id="cam-front" data-view="front" aria-pressed="false">Frente</button>
        <button type="button" id="cam-side" data-view="side" aria-pressed="false">Perfil</button>
        <button type="button" id="cam-back" data-view="back" aria-pressed="false">Espalda</button>
        <button type="button" id="cam-q34" data-view="q34" aria-pressed="true">3/4</button>
      </div>
      <div class="card toggles">
        <label><input type="checkbox" id="t-edges" checked><span>Aristas</span></label>
        <label><input type="checkbox" id="t-ruler" checked><span>Regla 8 cabezas</span></label>
        <label><input type="checkbox" id="t-spin"><span>Girar</span></label>
      </div>
    </div>
  </div>
</div>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Sprite Iso 3D</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d2230;
    --muted: #6b7285;
    --panel: rgba(255, 255, 255, 0.92);
    --line: rgba(29, 34, 48, 0.12);
    --accent: #d9731f;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: rgba(255, 255, 255, 0.94); }
  }
  :root[data-theme="dark"] { --panel: rgba(255, 255, 255, 0.94); }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--ink);
    overflow: hidden; overscroll-behavior: none;
    position: fixed; inset: 0;
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas#gl {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    display: block; touch-action: none; cursor: crosshair; background: var(--bg);
  }
  #jump {
    position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom));
    min-width: 92px; height: 52px; padding: 0 18px; border-radius: 26px; border: 0;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; letter-spacing: .06em;
    box-shadow: 0 6px 18px rgba(217, 115, 31, .35); touch-action: manipulation; cursor: pointer;
  }
  #jump:active { transform: translateY(1px) scale(.98); }
  #toggle {
    position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top));
    height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-weight: 600; touch-action: manipulation; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #panel {
    position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(56px + env(safe-area-inset-top));
    width: min(260px, calc(100vw - 24px)); box-sizing: border-box; padding: 10px 12px 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,.08); touch-action: manipulation;
  }
  #panel[hidden] { display: none; }
  #panel label { display: grid; grid-template-columns: 88px 1fr 38px; align-items: center; gap: 6px; margin: 6px 0; }
  #panel label.check { grid-template-columns: 1fr auto; }
  #panel input[type=range] { width: 100%; accent-color: var(--accent); }
  #panel input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  #panel output { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  #panel .foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; }
  #panel button { font: inherit; font-size: 11px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 2px 8px; color: var(--ink); }
  #hint {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    color: var(--muted); font-size: 12px; pointer-events: none; transition: opacity .6s; white-space: nowrap;
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--bg); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<button id="toggle" aria-expanded="false" aria-controls="panel">Ajustes</button>
<div id="panel" hidden>
  <label class="check">Normal maps <input id="nm" type="checkbox" checked></label>
  <label class="check">Luz girando <input id="auto" type="checkbox" checked></label>
  <label>Ángulo luz <input id="ang" type="range" min="0" max="360" step="1" value="40"><output id="angv">40°</output></label>
  <label>Intensidad <input id="inten" type="range" min="0" max="2" step="0.05" value="1"><output id="intenv">1.00</output></label>
  <label>Escala <input id="scale" type="range" min="0.5" max="2" step="0.05" value="1"><output id="scalev">1.00</output></label>
  <label>Velocidad <input id="speed" type="range" min="0.4" max="2" step="0.05" value="1"><output id="speedv">1.00</output></label>
  <div class="foot"><span id="fps">– fps</span><button id="fs" hidden>Pantalla completa</button></div>
</div>
<button id="jump">SALTAR</button>
<div id="hint">Toca para caminar · mantén para guiar · doble toque para saltar</div>
<div id="loading">Cargando…</div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Datos (inyectados por tools/build_demo.py)
// ---------------------------------------------------------------------------
const META = /*META*/null;
const IMG_COLOR = "/*IMG_COLOR*/";
const IMG_NORMAL = "/*IMG_NORMAL*/";
const IMG_SPEC = "/*IMG_SPEC*/";

const ANIMS = ["idle", "walk", "run", "jump"];
const DIRS = META.directions;               // S, SW, W, NW, N, NE, E, SE
const [FW, FH] = META.frame_size;
const [PVX, PVY] = META.pivot;
const [AW, AH] = META.atlas_size;
const COLS = META.columns;
const STAND_H = META.standing_height_px;    // alto de pie en px de textura
const NF = 6;
const ISO = 0.64;                           // sen(elevación de cámara) = alto/ancho de la baldosa
const COS_E = Math.sqrt(1 - ISO * ISO);

// ---------------------------------------------------------------------------
// Parámetros de movimiento (en múltiplos de H = alto del personaje en px CSS)
// ---------------------------------------------------------------------------
const P = {
  walkSpeed: 1.05, runSpeed: 2.7,           // H/s
  accel: 5.0, decel: 4.2,                   // H/s²
  turnRate: 11.0,                           // rad/s
  runDist: 4.0, walkBackDist: 2.2,          // correr si lejos (> 4H); pasar a andar cerca
  followRun: 1.2, followWalk: 0.7, followStop: 0.18,
  strideWalk: 0.72, strideRun: 1.35,        // distancia (H) por ciclo de 6 frames
  dirStep: 0.040,                           // s por dirección intermedia
  hysteresis: 8 * Math.PI / 180,
  jumpPrep: 0.07, jumpAir: 0.62, jumpLand: 0.15, jumpHeight: 0.5,
  tapTime: 170, doubleTap: 320,
  startDelay: 0.10,                         // anticipación al arrancar desde parado (gira en el sitio)
};

// ---------------------------------------------------------------------------
// WebGL
// ---------------------------------------------------------------------------
const canvas = document.getElementById("gl");
let gl = canvas.getContext("webgl2", { alpha: false, antialias: false, premultipliedAlpha: true, powerPreference: "high-performance" });
const isGL2 = !!gl;
if (!gl) gl = canvas.getContext("webgl", { alpha: false, antialias: false, premultipliedAlpha: true });

const VS_SPRITE = `
attribute vec2 aPos;
uniform vec4 uDst;      // x, y, w, h en px CSS (y hacia abajo)
uniform vec2 uRes;
uniform vec4 uRect;     // uv del frame en el atlas
varying vec2 vUv;
void main() {
  vec2 p = uDst.xy + aPos * uDst.zw;
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0) * vec4(1.0, -1.0, 1.0, 1.0);
  vUv = uRect.xy + aPos * uRect.zw;
}`;
const FS_SPRITE = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uColor, uNormal, uSpec;
uniform vec3 uL;            // dirección de la luz en espacio de vista (+y arriba, +z hacia la cámara)
uniform vec3 uLightCol;
uniform float uIntensity, uUseNormals, uAlpha;
void main() {
  vec4 c = texture2D(uColor, vUv);              // premultiplicado
  if (c.a < 0.004) discard;
  vec3 n = texture2D(uNormal, vUv).xyz * 2.0 - 1.0;
  n = normalize(mix(vec3(0.0, 0.0, 1.0), n, uUseNormals));
  float sm = texture2D(uSpec, vUv).r;
  vec3 L = normalize(uL);
  // difusa "envolvente": respeta el sombreado pintado y no deja zonas negras
  float ndl = dot(n, L);
  float diff = clamp((ndl + 0.4) / 1.4, 0.0, 1.0);
  // ambiente hemisférico suave (cielo frío arriba, suelo blanco cálido abajo)
  float hemi = 0.5 + 0.5 * n.y;
  vec3 amb = mix(vec3(0.60, 0.61, 0.66), vec3(0.66, 0.68, 0.76), hemi);
  // especular Blinn-Phong: brillo más duro cuanto más metálico
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float shin = mix(8.0, 64.0, sm);
  float spec = sm * pow(max(dot(n, H), 0.0), shin) * (shin + 8.0) / 48.0;
  // luz de borde fina en el lado que mira a la luz
  float lxy = length(L.xy);
  float edge = smoothstep(0.55, 0.92, length(n.xy)) * uUseNormals;
  float facing = max(dot(normalize(n.xy + 1e-4), L.xy / max(lxy, 1e-4)), 0.0);
  float rim = edge * pow(facing, 2.0) * smoothstep(0.05, 0.5, lxy);
  vec3 lc = uLightCol * uIntensity;
  vec3 col = c.rgb * (amb + lc * diff * 0.62)
           + c.a * lc * (spec * 0.55 + rim * 0.55);
  gl_FragColor = vec4(col, c.a) * uAlpha;
}`;

// Sombra proyectada: la silueta del frame tumbada en el suelo, en dirección
// contraria a la luz. uW / uD = vectores de pantalla por texel de ancho/alto.
const VS_SHADOW = `
attribute vec2 aPos;
uniform vec2 uRes, uPivot, uPivotTex, uFrame, uW, uD;
uniform vec4 uRect;
varying vec2 vUv;
varying float vH;
void main() {
  vec2 t = aPos * uFrame;                  // texel dentro del frame
  float xr = t.x - uPivotTex.x;
  float h = uPivotTex.y - t.y;
  vec2 p = uPivot + xr * uW + h * uD;
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0) * vec4(1.0, -1.0, 1.0, 1.0);
  vUv = uRect.xy + aPos * uRect.zw;
  vH = h / uFrame.y;
}`;
const FS_SHADOW = `
precision highp float;
varying vec2 vUv;
varying float vH;
uniform sampler2D uColor;
uniform vec4 uRect;
uniform vec2 uTexel;
uniform float uAlpha;
uniform vec3 uShadowCol;
float A(vec2 o) {
  vec2 uv = clamp(vUv + o * uTexel, uRect.xy, uRect.xy + uRect.zw);
  return texture2D(uColor, uv).a;
}
void main() {
  float t = clamp(vH * 1.6, 0.0, 1.0);
  float r = mix(1.0, 6.5, t);               // más difusa lejos de los pies
  float a = A(vec2(0.0));
  a += A(vec2( 0.53,  0.85) * r) + A(vec2(-0.85,  0.53) * r);
  a += A(vec2(-0.53, -0.85) * r) + A(vec2( 0.85, -0.53) * r);
  a += A(vec2( 1.0,   0.0) * r * 0.55) + A(vec2(0.0, 1.0) * r * 0.55);
  a += A(vec2(-1.0,   0.0) * r * 0.55) + A(vec2(0.0, -1.0) * r * 0.55);
  a /= 9.0;
  a *= uAlpha * mix(0.42, 0.14, t);
  gl_FragColor = vec4(uShadowCol * a, a);
}`;

// Elipses en el suelo: sombra de contacto (modo 0) y marcador del toque (modo 1)
const VS_ELL = `
attribute vec2 aPos;
uniform vec2 uRes, uCenter, uRadius;
varying vec2 vQ;
void main() {
  vQ = aPos * 2.0 - 1.0;
  vec2 p = uCenter + vQ * uRadius * 1.25;
  gl_Position = vec4(p / uRes * 2.0 - 1.0, 0.0, 1.0) * vec4(1.0, -1.0, 1.0, 1.0);
}`;
const FS_ELL = `
precision highp float;
varying vec2 vQ;
uniform float uMode, uAlpha, uThick, uAA;
uniform vec3 uCol;
void main() {
  float d = length(vQ * 1.25);
  float a;
  if (uMode < 0.5) {
    a = exp(-d * d * 2.6) * smoothstep(1.25, 0.9, d);
  } else {
    float w = uAA;
    a = smoothstep(1.0 + w, 1.0 - w, d) * smoothstep(1.0 - uThick - w, 1.0 - uThick + w, d);
    a += 0.18 * smoothstep(1.0, 0.0, d);
  }
  a *= uAlpha;
  gl_FragColor = vec4(uCol * a, a);
}`;

function compile(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const progSprite = compile(VS_SPRITE, FS_SPRITE);
const progShadow = compile(VS_SHADOW, FS_SHADOW);
const progEll = compile(VS_ELL, FS_ELL);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // todo premultiplicado

function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
function makeTexture(img, unit, premultiply, format) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, premultiply);
  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);  // normales exactas
  gl.texImage2D(gl.TEXTURE_2D, 0, format, format, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (isGL2) {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAX_LEVEL, 3);    // sin sangrado entre frames
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  } else {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  }
  return t;
}

// ---------------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------------
const ui = {
  normals: true, auto: true, angle: 40, intensity: 1, scale: 1, speed: 1,
};
let cssW = 1, cssH = 1, dpr = 1, baseScale = 1;
const S = {
  x: 0, z: 0,                  // posición en el suelo (px CSS; pantalla = (x, z*ISO))
  heading: Math.PI / 2,        // ángulo en el suelo (atan2(z, x)); PI/2 = hacia la cámara (S)
  speed: 0,
  target: null, following: false, gait: "walk",
  anim: "idle", dir: 0, dirWanted: 0, lastDirStep: 0,
  phase: 0, idleT: 0,
  jump: null, squash: 0,
  prev: null, fade: 0,
  arrivedAt: 0, lastMoveStart: -1, startDelay: 0, startPos: null,
};
const markers = [];
let followMarker = null;
let lightAngle = 40;           // grados, 0 = luz desde el lado de la cámara
let time = 0;

function H() { return STAND_H * spriteScale(); }                 // alto del personaje en px CSS
function spriteScale() { return baseScale * ui.scale; }           // px CSS por texel
function dirVector(i) { const a = i * Math.PI / 4; return [-Math.sin(a), Math.cos(a)]; }
function dirAngle(i) { const [x, z] = dirVector(i); return Math.atan2(z, x); }
function dirIndexFromHeading(h) {
  const dx = Math.cos(h), dz = Math.sin(h);
  let a = Math.atan2(-dx, dz);                  // desde S, sentido horario en pantalla
  return ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
}
function wrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ---------------------------------------------------------------------------
// Tamaño / devicePixelRatio
// ---------------------------------------------------------------------------
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cssW = window.innerWidth; cssH = window.innerHeight;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const hWanted = clamp(Math.min(cssH * 0.24, cssW * 0.36), 100, 220);
  baseScale = hWanted / STAND_H;
  if (!S.init) { S.x = cssW / 2; S.z = (cssH * 0.62) / ISO; S.init = true; }
  const b = bounds();
  S.x = clamp(S.x, b.x0, b.x1); S.z = clamp(S.z, b.z0, b.z1);
}
function bounds() {
  const h = H();
  return { x0: h * 0.48, x1: cssW - h * 0.48, z0: (h * 1.05) / ISO, z1: (cssH - h * 0.12) / ISO };
}
window.addEventListener("resize", resize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

// ---------------------------------------------------------------------------
// Entrada: toque / clic, mantener, doble toque
// ---------------------------------------------------------------------------
const ptr = { down: false, id: null, t0: 0, x0: 0, y0: 0, x: 0, y: 0, timer: 0 };
let lastTap = null;

function toGround(sx, sy) {
  const b = bounds();
  return { x: clamp(sx, b.x0, b.x1), z: clamp(sy / ISO, b.z0, b.z1) };
}
function setTarget(sx, sy, withMarker) {
  const g = toGround(sx, sy);
  const wasIdle = !S.target && S.speed < 0.05 * H() && !S.jump;
  S.target = g;
  const dist = Math.hypot(g.x - S.x, g.z - S.z);
  if (!S.following) S.gait = dist > P.runDist * H() ? "run" : "walk";
  if (withMarker) markers.push({ x: g.x, z: g.z, t: 0 });
  if (wasIdle) { S.lastMoveStart = time; S.startDelay = P.startDelay; S.startPos = { x: S.x, z: S.z }; }
  return wasIdle;
}
canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (ptr.down) return;
  canvas.setPointerCapture(e.pointerId);
  Object.assign(ptr, { down: true, id: e.pointerId, t0: performance.now(), x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY });
  clearTimeout(ptr.timer);
  ptr.timer = setTimeout(() => { if (ptr.down) startFollow(); }, P.tapTime);
  hideHint();
});
canvas.addEventListener("pointermove", (e) => {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (!S.following && Math.hypot(ptr.x - ptr.x0, ptr.y - ptr.y0) > 12) startFollow();
  if (S.following) followUpdate();
});
function endPointer(e) {
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false;
  clearTimeout(ptr.timer);
  if (S.following) {
    S.following = false;
    followMarker = null;
    // al soltar, termina el camino hasta el último punto
    setTarget(ptr.x, ptr.y, true);
    return;
  }
  if (e.type === "pointercancel") return;
  const now = performance.now();
  if (lastTap && now - lastTap.t < P.doubleTap && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 60) {
    // doble toque: si el primer toque arrancó desde parado, se anula ese paseo y salta en el sitio
    if (lastTap.wasIdle) {
      S.target = null; S.speed = 0; markers.pop();
      // vuelve al punto de partida si apenas se había movido (anticipación de 0.1 s)
      if (S.startPos && Math.hypot(S.x - S.startPos.x, S.z - S.startPos.z) < 0.1 * H()) { S.x = S.startPos.x; S.z = S.startPos.z; }
    }
    doJump();
    lastTap = null;
    return;
  }
  const wasIdle = setTarget(e.clientX, e.clientY, true);
  lastTap = { t: now, x: e.clientX, y: e.clientY, wasIdle };
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
function startFollow() {
  S.following = true;
  followMarker = { x: 0, z: 0 };
  followUpdate();
}
function followUpdate() {
  const g = toGround(ptr.x, ptr.y);
  followMarker.x = g.x; followMarker.z = g.z;
  S.target = g;
}
// Sin zoom ni scroll accidentales (iOS)
for (const ev of ["gesturestart", "gesturechange", "dblclick", "contextmenu"]) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener("touchmove", (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

const jumpBtn = document.getElementById("jump");
jumpBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); doJump(); hideHint(); });
window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); doJump(); } });

function doJump() {
  if (S.jump) return;
  const moving = S.speed > 0.2 * P.walkSpeed * ui.speed * H();
  S.jump = { t: 0, forward: moving, v: moving ? Math.max(S.speed, P.walkSpeed * ui.speed * H()) : 0, landed: false };
  if (!moving) S.speed = 0;
}

// ---------------------------------------------------------------------------
// Simulación (delta time)
// ---------------------------------------------------------------------------
function update(dt) {
  time += dt;
  const h = H();
  const k = ui.speed;
  const walkV = P.walkSpeed * k * h, runV = P.runSpeed * k * h;
  const accel = P.accel * k * h, decel = P.decel * k * h;
  // --- salto ---------------------------------------------------------------
  if (S.jump) {
    const J = S.jump;
    J.t += dt;
    const air0 = P.jumpPrep, air1 = P.jumpPrep + P.jumpAir;
    if (J.t >= air0 && J.t < air1) {
      const hv = J.v;
      S.x += Math.cos(S.heading) * hv * dt;
      S.z += Math.sin(S.heading) * hv * dt;
    } else if (J.t >= air1 && !J.landed) {
      J.landed = true; S.squash = 1;
      S.speed = J.forward ? J.v * 0.65 : 0;
    }
    if (J.t >= air1 + P.jumpLand) {
      S.jump = null;
      S.phase = 0.25;
    }
    const b = bounds();
    S.x = clamp(S.x, b.x0, b.x1); S.z = clamp(S.z, b.z0, b.z1);
  }
  // --- desplazamiento --------------------------------------------------------
  if (!S.jump) {
    if (S.target) {
      const dx = S.target.x - S.x, dz = S.target.z - S.z;
      const dist = Math.hypot(dx, dz);
      // marcha: correr si lejos, andar al acercarse (con histéresis)
      if (S.following) {
        if (dist > P.followRun * h) S.gait = "run";
        else if (dist < P.followWalk * h) S.gait = "walk";
      } else if (S.gait === "run" && dist < P.walkBackDist * h) S.gait = "walk";
      const arriveR = S.following ? P.followStop * h : 0.004 * h;
      let vMax = S.gait === "run" ? runV : walkV;
      // frenado suave: v = sqrt(2·a·d)
      let vWanted = Math.min(vMax, Math.sqrt(2 * decel * Math.max(dist - arriveR, 0)));
      if (S.startDelay > 0) { S.startDelay -= dt; vWanted = 0; }
      if (dist > arriveR * 0.5) {
        const want = Math.atan2(dz, dx);
        const diff = wrap(want - S.heading);
        const maxTurn = P.turnRate * dt;
        S.heading = wrap(S.heading + clamp(diff, -maxTurn, maxTurn));
        // giros cerrados: frena mientras gira
        if (Math.abs(diff) > 1.6) vWanted *= 0.35;
        else if (Math.abs(diff) > 0.8) vWanted *= 0.7;
      }
      const dv = vWanted - S.speed;
      S.speed += clamp(dv, -decel * 1.6 * dt, accel * dt);
      S.speed = Math.max(0, S.speed);
      let step = S.speed * dt;
      if (step >= dist) { step = dist; }
      S.x += Math.cos(S.heading) * step;
      S.z += Math.sin(S.heading) * step;
      if (!S.following && dist - step <= arriveR && S.speed < 0.12 * walkV) {
        S.x = S.target.x; S.z = S.target.z;       // < 1 px: encaje exacto
        S.target = null; S.arrivedAt = time; S.speed = 0;
      }
    } else {
      S.speed = Math.max(0, S.speed - decel * 1.6 * dt);
      S.x += Math.cos(S.heading) * S.speed * dt;
      S.z += Math.sin(S.heading) * S.speed * dt;
    }
  }
  // --- animación --------------------------------------------------------------
  let anim;
  if (S.jump) anim = "jump";
  else {
    const runUp = walkV * 1.35, runDown = walkV * 1.18;
    const walkUp = 0.07 * h, walkDown = 0.035 * h;
    if (S.anim === "run") anim = S.speed > runDown ? "run" : (S.speed > walkDown ? "walk" : "idle");
    else if (S.anim === "walk") anim = S.speed > runUp ? "run" : (S.speed > walkDown ? "walk" : "idle");
    else anim = S.speed > runUp ? "run" : (S.speed > walkUp ? "walk" : "idle");
    // si hay objetivo o se está siguiendo el dedo pero todavía gira en el sitio, anda
    if (anim === "idle" && S.target && S.speed > 0.01 * h) anim = "walk";
  }
  if (anim !== S.anim) {
    if (S.anim !== "jump" && anim !== "jump") { S.prev = frameInfo(); S.fade = 1; }
    if (anim === "idle") S.idleT = 0;
    S.anim = anim;
  }
  if (anim === "walk" || anim === "run") {
    // fase sincronizada con la distancia recorrida -> los pies no patinan
    const stride = (anim === "run" ? P.strideRun : P.strideWalk) * h;
    S.phase = (S.phase + S.speed * dt / stride) % 1;
  } else if (anim === "idle") {
    S.idleT += dt;
  }
  S.fade = Math.max(0, S.fade - dt / 0.09);
  S.squash = Math.max(0, S.squash - dt / 0.16);
  // --- dirección del sprite ----------------------------------------------------
  const moving = S.speed > 0.01 * h || (S.jump && S.jump.forward) || (S.target && !S.jump);
  if (moving) {
    const cur = dirAngle(S.dirWanted);
    const d = Math.abs(wrap(S.heading - cur));
    if (d > Math.PI / 8 + P.hysteresis) S.dirWanted = dirIndexFromHeading(S.heading);
  }
  if (S.dir !== S.dirWanted && time - S.lastDirStep >= P.dirStep) {
    let delta = ((S.dirWanted - S.dir) % 8 + 8) % 8;
    S.dir = (S.dir + (delta <= 4 ? 1 : 7)) % 8;       // pasa por las intermedias
    S.lastDirStep = time;
  }
  if (!moving && !S.jump && S.speed === 0) S.heading = S.target ? S.heading : S.heading;
  // --- luz -------------------------------------------------------------------------
  if (ui.auto) {
    lightAngle = (lightAngle + dt * 14) % 360;
    angInput.value = Math.round(lightAngle); angOut.textContent = Math.round(lightAngle) + "°";
  } else lightAngle = ui.angle;
  // --- marcadores ---------------------------------------------------------------------
  for (const m of markers) m.t += dt;
  while (markers.length && markers[0].t > 0.6) markers.shift();
}

function jumpFrame() {
  const J = S.jump, t = J.t;
  const air0 = P.jumpPrep, air1 = P.jumpPrep + P.jumpAir;
  if (t < air0) return { f: 0, hgt: 0 };
  if (t < air1) {
    const u = (t - air0) / P.jumpAir;
    const f = u < 0.2 ? 1 : u < 0.45 ? 2 : u < 0.72 ? 3 : 4;
    return { f, hgt: 4 * u * (1 - u) * P.jumpHeight * H() };
  }
  return { f: 5, hgt: 0 };
}

function frameInfo() {
  if (S.anim === "jump") return { anim: "jump", dir: S.dir, f: jumpFrame().f };
  if (S.anim === "idle") return { anim: "idle", dir: S.dir, f: Math.floor(S.idleT * META.animations.idle.fps) % NF };
  return { anim: S.anim, dir: S.dir, f: Math.floor(S.phase * NF) % NF };
}
function frameRect(anim, dir, f) {
  const k = (ANIMS.indexOf(anim) * 8 + dir) * NF + f;
  const c = k % COLS, r = Math.floor(k / COLS);
  return [c * FW / AW, r * FH / AH, FW / AW, FH / AH];
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function lightVectors() {
  const th = lightAngle * Math.PI / 180, ph = 48 * Math.PI / 180;
  // mundo: x derecha, y arriba, z hacia la cámara (en el suelo)
  const Lw = [Math.cos(ph) * Math.sin(th), Math.sin(ph), Math.cos(ph) * Math.cos(th)];
  // vista (cámara inclinada: sen(e) = ISO)
  const Lv = [Lw[0], Lw[1] * COS_E - Lw[2] * ISO, Lw[1] * ISO + Lw[2] * COS_E];
  // sombra en el suelo: opuesta a la luz
  const Dg = [-Math.sin(th), -Math.cos(th)];
  return { Lv, Dg, cot: Math.cos(ph) / Math.sin(ph) };
}

function drawEllipse(cx, cy, rx, ry, mode, alpha, col, thick) {
  const u = progEll.u;
  gl.useProgram(progEll.p);
  gl.uniform2f(u.uRes, cssW, cssH);
  gl.uniform2f(u.uCenter, cx, cy);
  gl.uniform2f(u.uRadius, rx, ry);
  gl.uniform1f(u.uMode, mode);
  gl.uniform1f(u.uAlpha, alpha);
  gl.uniform1f(u.uThick, thick || 0.2);
  gl.uniform1f(u.uAA, 1.2 / Math.max(ry, 1));
  gl.uniform3fv(u.uCol, col);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

let renderState = {};
function render() {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(1, 1, 1, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const h = H(), s = spriteScale();
  const px = S.x, py = S.z * ISO;              // pivote (suelo) en pantalla
  const fi = frameInfo();
  let lift = 0, hgt = 0;
  if (S.anim === "jump") {
    const jf = jumpFrame();
    hgt = jf.hgt;
    lift = (META.foot_lift["jump_" + DIRS[fi.dir]][fi.f] || 0) * s;
  }
  // bob sincronizado con los pasos (2 por ciclo)
  let bob = 0;
  if (S.anim === "walk" || S.anim === "run") {
    const A = (S.anim === "run" ? 0.026 : 0.011) * h;
    bob = A * Math.pow(Math.sin(S.phase * 2 * Math.PI), 2);
  }
  const { Lv, Dg, cot } = lightVectors();
  const ang = Math.atan2(Dg[1], Dg[0]);

  // --- sombra de contacto -----------------------------------------------------------
  const air = hgt / h;
  const shrink = 1 / (1 + air * 1.6);
  const fadeAir = 1 / (1 + air * 3.0);
  drawEllipse(px, py, h * 0.27 * shrink, h * 0.27 * ISO * shrink, 0, 0.32 * fadeAir, [0.12, 0.13, 0.18]);

  // --- sombra proyectada ---------------------------------------------------------------
  {
    const u = progShadow.u;
    gl.useProgram(progShadow.p);
    const len = Math.min(cot, 1.0) * 0.85 / COS_E;
    const sc = s * shrink;
    const W = [-Dg[1], Dg[0]];                     // perpendicular a D en el suelo
    gl.uniform2f(u.uRes, cssW, cssH);
    gl.uniform2f(u.uPivot, px, py);
    gl.uniform2f(u.uPivotTex, PVX, PVY - lift / s);  // en el aire: la silueta se tumba desde los pies
    gl.uniform2f(u.uFrame, FW, FH);
    gl.uniform2f(u.uW, W[0] * sc, W[1] * ISO * sc);
    gl.uniform2f(u.uD, Dg[0] * len * sc, Dg[1] * ISO * len * sc);
    gl.uniform4fv(u.uRect, frameRect(fi.anim, fi.dir, fi.f));
    gl.uniform2f(u.uTexel, 1 / AW, 1 / AH);
    gl.uniform1f(u.uAlpha, fadeAir * clamp(ui.intensity, 0.2, 1.4));
    gl.uniform3f(u.uShadowCol, 0.10, 0.11, 0.16);
    gl.uniform1i(u.uColor, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // --- marcadores ---------------------------------------------------------------------------
  const accent = [0.85, 0.45, 0.12];
  for (const m of markers) {
    const t = m.t / 0.6;
    const r = h * (0.34 - 0.24 * (1 - Math.pow(1 - t, 3)));
    drawEllipse(m.x, m.z * ISO, r, r * ISO, 1, (1 - t) * 0.9, accent, 0.22);
  }
  if (followMarker) {
    const r = h * (0.16 + 0.02 * Math.sin(time * 8));
    drawEllipse(followMarker.x, followMarker.z * ISO, r, r * ISO, 1, 0.8, accent, 0.3);
  }

  // --- personaje -------------------------------------------------------------------------------
  const u = progSprite.u;
  gl.useProgram(progSprite.p);
  gl.uniform2f(u.uRes, cssW, cssH);
  gl.uniform1i(u.uColor, 0); gl.uniform1i(u.uNormal, 1); gl.uniform1i(u.uSpec, 2);
  gl.uniform3fv(u.uL, Lv);
  gl.uniform3f(u.uLightCol, 1.0, 0.92, 0.80);
  gl.uniform1f(u.uIntensity, ui.intensity);
  gl.uniform1f(u.uUseNormals, ui.normals ? 1 : 0);
  // squash al aterrizar (anclado en los pies)
  const sq = Math.sin(S.squash * Math.PI) * (S.squash > 0 ? 1 : 0);
  const sy = 1 - 0.09 * sq, sx = 1 + 0.06 * sq;
  const yUp = hgt - lift + bob;
  function drawSprite(info, alpha) {
    const w = FW * s * sx, hh = FH * s * sy;
    gl.uniform4f(u.uDst, px - PVX * s * sx, py - yUp - PVY * s * sy, w, hh);
    gl.uniform4fv(u.uRect, frameRect(info.anim, info.dir, info.f));
    gl.uniform1f(u.uAlpha, alpha);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  if (S.fade > 0 && S.prev) drawSprite(S.prev, S.fade);
  drawSprite(fi, 1);
  renderState = { frame: fi, x: S.x, z: S.z, screenX: px, screenY: py, yUp, h };
}

// ---------------------------------------------------------------------------
// Bucle
// ---------------------------------------------------------------------------
let last = 0, fpsAcc = 0, fpsN = 0, fpsT = 0, fps = 0;
const fpsEl = document.getElementById("fps");
function loop(ts) {
  const t = ts / 1000;
  let dt = last ? t - last : 1 / 60;
  last = t;
  dt = Math.min(dt, 0.05);
  update(dt);
  render();
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { fps = fpsN / fpsT; fpsEl.textContent = fps.toFixed(0) + " fps · " + dpr.toFixed(1) + "x"; fpsN = 0; fpsT = 0; }
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------------
// Panel
// ---------------------------------------------------------------------------
const panel = document.getElementById("panel");
const toggle = document.getElementById("toggle");
toggle.addEventListener("click", () => {
  panel.hidden = !panel.hidden;
  toggle.setAttribute("aria-expanded", String(!panel.hidden));
});
const angInput = document.getElementById("ang"), angOut = document.getElementById("angv");
function bindRange(id, key, fmt, onInput) {
  const el = document.getElementById(id), out = document.getElementById(id + "v");
  const set = () => { ui[key] = parseFloat(el.value); out.textContent = fmt(ui[key]); if (onInput) onInput(); };
  el.addEventListener("input", set);
  set();
}
bindRange("ang", "angle", (v) => Math.round(v) + "°", () => { if (ui.auto && document.activeElement === angInput) { ui.auto = false; document.getElementById("auto").checked = false; } });
angInput.addEventListener("pointerdown", () => { ui.auto = false; document.getElementById("auto").checked = false; });
bindRange("inten", "intensity", (v) => v.toFixed(2));
bindRange("scale", "scale", (v) => v.toFixed(2), () => resize());
bindRange("speed", "speed", (v) => v.toFixed(2));
document.getElementById("nm").addEventListener("change", (e) => { ui.normals = e.target.checked; });
document.getElementById("auto").addEventListener("change", (e) => { ui.auto = e.target.checked; if (!ui.auto) ui.angle = lightAngle; });
const fsBtn = document.getElementById("fs");
if (document.fullscreenEnabled) {
  fsBtn.hidden = false;
  fsBtn.addEventListener("click", () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
}
const hint = document.getElementById("hint");
function hideHint() { hint.style.opacity = 0; }

// API mínima para pruebas automáticas
window.__demo = {
  state: () => ({ x: S.x, z: S.z, speed: S.speed, anim: S.anim, dir: DIRS[S.dir], dirIndex: S.dir, target: S.target,
                  following: S.following, gait: S.gait, jumping: !!S.jump, H: H(), light: lightAngle, fps,
                  frame: renderState.frame, screen: [renderState.screenX, renderState.screenY], yUp: renderState.yUp,
                  dpr, canvas: [canvas.width, canvas.height] }),
  ground: (sx, sy) => toGround(sx, sy),
  setLight: (deg) => { ui.auto = false; document.getElementById("auto").checked = false; ui.angle = deg; lightAngle = deg; angInput.value = deg; angOut.textContent = Math.round(deg) + "°"; },
  teleport: (sx, sy) => { const g = toGround(sx, sy); S.x = g.x; S.z = g.z; S.target = null; S.speed = 0; },
};

// ---------------------------------------------------------------------------
// Arranque
// ---------------------------------------------------------------------------
resize();
Promise.all([loadImage(IMG_COLOR), loadImage(IMG_NORMAL), loadImage(IMG_SPEC)]).then(([c, n, sp]) => {
  makeTexture(c, 0, true, gl.RGBA);
  makeTexture(n, 1, false, gl.RGB);
  makeTexture(sp, 2, false, gl.LUMINANCE);
  document.getElementById("loading").remove();
  window.__demo.ready = true;
  requestAnimationFrame(loop);
}).catch((e) => { document.getElementById("loading").textContent = "Error cargando texturas: " + e; });
</script>
</body>
